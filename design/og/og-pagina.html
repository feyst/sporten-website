<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Sjabloon deelafbeelding per pagina</title>
<!--
  Template for public/img/og/<slug>.png: the image shown when someone shares a
  specific page. Filled from the query string by maak-og.cjs, which reads
  design/og/paginas.json. Same background and logo as og.html, so a shared page
  is recognisable as sporten.app but still says what the page is about.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #f4511e 0%, #d63c0e 55%, #b8330b 100%);
    color: #fff;
  }
  .bol {
    position: absolute; left: -180px; top: -120px; width: 820px; height: 820px;
    border-radius: 50%; background: rgba(255, 255, 255, .07);
  }
  .in { position: absolute; inset: 72px 80px 64px; display: flex; flex-direction: column; }
  .logo { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .logo span { background: #fff; color: #f4511e; border-radius: 10px; padding: 2px 12px; }
  .label {
    margin-top: auto; align-self: flex-start;
    font-size: 20px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: #ffd9cc;
  }
  h1 { margin-top: 12px; font-size: 64px; line-height: 1.06; letter-spacing: -.025em; font-weight: 800; max-width: 16em; }
  p { margin-top: 22px; font-size: 28px; line-height: 1.38; color: rgba(255, 255, 255, .92); max-width: 30em; }
  .adres { margin-top: auto; padding-top: 28px; font-size: 22px; font-weight: 600; color: rgba(255, 255, 255, .8); }
</style>
</head>
<body>
  <div class="bol"></div>
  <div class="in">
    <div class="logo">sporten<span>.app</span></div>
    <div class="label" id="label"></div>
    <h1 id="kop"></h1>
    <p id="sub"></p>
    <div class="adres" id="adres"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    for (const id of ['label', 'kop', 'sub', 'adres']) document.getElementById(id).textContent = q.get(id) || '';
  </script>
</body>
</html>
