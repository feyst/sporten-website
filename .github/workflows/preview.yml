name: 🔍 PR-preview
# Bouwt de site bij elke PR en zet hem op GitHub Pages onder
# /pr-preview/pr-<nummer>/; de action plaatst zelf een comment met de link
# in de PR en ruimt de preview op zodra de PR sluit.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    name: Preview bijwerken
    # Bewust GitHubs machine en niet de eigen runner, in tegenstelling tot
    # main.yml hiernaast. Deze repo is openbaar en forken staat aan, en dit is
    # een `pull_request`-workflow: hij bouwt dus de code uit de PR. Op de eigen
    # runner zou een wildvreemde PR daarmee code draaien op de machine thuis —
    # en die runner deelt de docker-socket van de host, dus dat is geen
    # sandbox maar de sleutel van het huis. De deploy in main.yml loopt wél
    # over de eigen runner: die gaat alleen af op een push naar main, en daar
    # komt geen forkcode in.
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        if: github.event.action != 'closed'
        # Zie main.yml: playwright is hier niet nodig, de browserdownload wel duur.
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: 🔨 Build met preview-basispad
        if: github.event.action != 'closed'
        run: npm run build
        env:
          PREVIEW_BASE: /sporten-website/pr-preview/pr-${{ github.event.number }}/

      - name: 🔍 Preview plaatsen of opruimen
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
