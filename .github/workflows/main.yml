on:
  push:
    branches:
      - main
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    # Bewust GitHubs machine, in tegenstelling tot de andere sporten-repo's.
    # Deze stap synct per FTPS naar de hosting, en vanaf de eigen runner komt
    # die verbinding er niet: poort 21 naar de webserver wordt geweigerd
    # (ECONNREFUSED, nagemeten vanaf de host én vanuit de runner, terwijl 443
    # naar diezelfde server gewoon open is). Dat zit dus in het netwerk tussen
    # thuis en de hosting, niet in de workflow. Verhuizen naar de eigen runner
    # kan pas als die verbinding open is; tot die tijd zou het de publicatie
    # van de live site stilleggen.
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build
        run: npm run build

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          protocol: ftps
          local-dir: ./dist/
          server: sporten.app
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
